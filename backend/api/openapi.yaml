openapi: 3.0.3
info:
  title: GB EMR API
  version: 1.0.0
  description: 电子病历管理系统核心接口。
paths:
  /healthz:
    get: {summary: 健康检查, responses: {'200': {description: healthy}}}
  /api/v1/auth/login:
    post: {summary: 登录获取 JWT, responses: {'200': {description: success}}}
  /api/v1/patients:
    get: {summary: 检索患者}
    post: {summary: 创建患者}
  /api/v1/records:
    get: {summary: 多维病历检索}
    post: {summary: 创建结构化病历（可传 template_id 快照模板名称/版本/原文）}
  /api/v1/templates:
    get: {summary: 各病历模板最新版本（医生选用）}
  /api/v1/admin/templates:
    get: {summary: 模板全部历史版本（含更新时间与历史内容）}
    post: {summary: 新建模板（初始 v1）}
  /api/v1/admin/templates/{id}:
    put: {summary: 更新模板，生成递增新版本，历史版本保留}
  /api/v1/prescriptions:
    post: {summary: 开具电子处方}
