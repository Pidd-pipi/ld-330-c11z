openapi: 3.0.3
info:
  title: GB EMR API
  version: 1.0.0
  description: 电子病历管理系统核心接口。
paths:
  /healthz:
    get: {summary: 健康检查, responses: {'200': {description: healthy}}}
  /api/v1/auth/login:
    post: {summary: 登录获取 JWT, responses: {'200': {description: success}}}
  /api/v1/patients:
    get: {summary: 检索患者}
    post: {summary: 创建患者}
  /api/v1/records:
    get: {summary: 多维病历检索}
    post: {summary: 创建结构化病历（可携带 template_version_id 快照模板）}
  /api/v1/templates:
    get: {summary: 病历模板选项（每个模板的最新版本，供医生书写时选择）}
  /api/v1/admin/templates:
    get: {summary: 模板列表（含全部历史版本，管理员）}
    post: {summary: 新建模板（首个内容即第 1 版，管理员）}
  /api/v1/admin/templates/{id}:
    put: {summary: 发布模板新版本（历史版本保留，管理员）}
  /api/v1/prescriptions:
    post: {summary: 开具电子处方}
